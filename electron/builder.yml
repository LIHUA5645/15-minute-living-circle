appId: com.shenghuoquan.tijian
productName: 生活圈体检助手
copyright: "Copyright © 2026 肖沐樑 (QQ: 3387432690)"
directories:
  output: release
  buildResources: build
# 关闭 asar：主进程用 ESM 动态 import 加载 src 下的适配器/服务模块，
# Electron 不支持从 asar 内部加载 ES Module——关掉 asar 后按普通目录落盘才能加载
asar: false
files:
  - dist/**
  - electron/**
  - src/**      # 主进程运行时动态 import 的数据源适配器（bmapServer 等）必须随包
  - fuwuqi/**   # 主进程内嵌用户/管理员鉴权服务（yonghu-fuwu.mjs）
  - package.json
win:
  target: nsis
  icon: logo1.png
  artifactName: 生活圈体检助手-Setup-${version}.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
