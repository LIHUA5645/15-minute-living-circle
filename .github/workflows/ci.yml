name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 代码格式检查
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: 单元测试
        run: npm run test
      - name: 构建 Web
        run: npm run build
      - name: 小程序三端一致性检查（引擎 / 共享层 / 生成视图 与真源比对）
        run: npm run xcx:jiancha
      - name: 小程序自检（引擎同源、提示词逐字一致等 28 项；无服务端时自动跳过依赖项）
        run: npm run xcx:zijian
